<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="text" href="icon.png" />
  <title>Building Bell</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Roboto, sans-serif;
      background-color: #ffd54f;
      font-size: 24px;
      word-wrap: break-word;
      height: 100%;
      background-image: url("https://static.vecteezy.com/system/resources/previews/016/558/061/large_2x/beautiful-winter-background-with-snow-new-year-christmas-and-other-holidays-web-poster-greeting-card-free-photo.jpg");
      background-size: cover;
      background-position: center;
    }

    .container,
    .containerm {
      width: 100%;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      padding: 0;
    }

    .digits {
      font-size: 7vw;
      width: 35vw;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 1vw;
      text-align: center;
      font-weight: bold;
    }

    .digits1 {
      font-size: 7vw;
      width: 43vw;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 1vw;
      text-align: center;
      font-weight: bold;
    }

    .digits2 {
      font-size: 10vw;
      width: 78vw;
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      border-radius: 1vw;
      text-align: center;
      font-weight: bold;
    }

    .mini {
      font-size: 6vw;
    }

    .tdm {
      text-align: center;
      padding: 0.5vw;
    }

    /* === Schedule table styling === */
    .scheduleTable {
      width: 70vw;
      margin-top: 2vh;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border-radius: 12px;
      border-collapse: collapse;
      font-size: 3vw;
      overflow: hidden;
    }

    .scheduleTable th,
    .scheduleTable td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      text-align: left;
    }

    .scheduleTable th {
      background-color: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .scheduleTable td:first-child {
      width: 110px;
      font-weight: 800;
    }

    .currentRow {
      background-color: rgba(255, 255, 0, 0.35);
      font-weight: 900;
    }

    .nextRow {
      background-color: rgba(0, 255, 255, 0.18);
      font-weight: 800;
    }
    .scheduleTable option {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      text-align: center;
      font-weight: 1200;
    }
  </style>
</head>

<body>
  <center>
    <table onclick="openFullscreen();">
      <tbody>
        <tr>
          <td class="tdm">
            <div id="date" class="digits">📅00/00</div>
          </td>
          <td class="tdm">
            <div id="time" class="digits1"> ⌚13:38:07</div>
          </td>
        </tr>
        <tr>
          <td class="tdm" colspan="2">
            <div id="currentPeriod" class="digits2">Period 7</div>
          </td>
        </tr>
        <tr>
          <td class="tdm" colspan="2">
            <div id="countdown" class="digits2">⏳42: 52</div>
          </td>
        </tr>
        <tr>
          <td class="tdm" colspan="2">
            <div id="nextBellTime" class="digits2">🔔 14:21</div>
          </td>
        </tr>
      </tbody>
    </table>
    <select id="url-navigator" onchange="navigateToBuilding(this)" class="scheduleTable">
        <option value="1">1st Building</option>
        <option value="2">2nd Building</option>
    </select>

    <div style="margin-top: 10px;">
      <label style="font-size: 4vw; font-weight: 700; text-transform: none;">
        <input type="checkbox" id="soundBeep" style="transform: scale(4); margin-right: 8px;">
        🔊 Bell Beep
      </label>
    </div>

    <!-- Daily schedule table -->
    <table id="dailySchedule" class="scheduleTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Event</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
const regularSchedule = [
{ time: "00:00:01", name: "Before School" },
        { time: "07:45:00", name: "Period 1" },
        { time: "08:46:00", name: "Passing" },
        { time: "08:51:00", name: "Period 2" },

        { time: "11:52:00", name: "Passing" },

        { time: "23:31:59", name: "Midnight" }
];

const fridaySchedule = [
{ time: "00:00:01", name: "Before School" },
        { time: "07:45:00", name: "Period 1" },
        { time: "08:23:00", name: "Passing" },
        { time: "08:28:00", name: "Period 2" },
        { time: "09:06:00", name: "Passing" },
        { time: "09:11:00", name: "Period 3" },
        { time: "09:49:00", name: "Passing" },
        { time: "09:54:00", name: "Period 4" },
        { time: "10:32:00", name: "Passing" },
        { time: "10:37:00", name: "Lunch 1" },
        { time: "11:02:00", name: "Passing" },
        { time: "11:07:00", name: "6 Period" },
        { time: "11:45:00", name: "Passing" },
        { time: "11:50:00", name: "Period 7" },
        { time: "12:28:00", name: "Passing" },
        { time: "12:33:00", name: "Period 8" },
        { time: "13:11:00", name: "Dismissal" },
        { time: "13:30:00", name: "After School" },
        { time: "23:31:59", name: "Midnight" }
];

const saturdaySchedule = [
{ time: "00:00:01", name: "Before School" },
        { time: "09:00:00", name: "1st Tutorial" },
        { time: "10:30:00", name: "Passing" },
        { time: "10:35:00", name: "2nd Tutorial" },
        { time: "12:00:00", name: "Dismissal" },
        { time: "12:30:00", name: "No School Event" }
];

const sundaySchedule = [

        { time: "09:00:00", name: "No School Today" }
];

const regularScheduleB2 = [
{ time: "00:00:01", name: "Before School" },
        { time: "07:45:00", name: "Period 1" },
        { time: "08:46:00", name: "Passing" },
        { time: "08:51:00", name: "Period 2" },
        { time: "09:48:00", name: "Passing" },
        { time: "09:53:00", name: "Period 3" },
        { time: "10:50:00", name: "Passing" },
        { time: "10:55:00", name: "Period 4" },
        { time: "11:52:00", name: "Passing" },
        { time: "11:57:00", name: "Period 5" },
        { time: "12:54:00", name: "Passing" },
        { time: "12:59:00", name: "2nd Lunch" },
        { time: "13:24:00", name: "Passing" },
        { time: "13:29:00", name: "Period 7" },
        { time: "14:26:00", name: "Passing" },
        { time: "14:31:00", name: "Period 8" },
        { time: "15:28:00", name: "Dismissal/Tutorials" },
        { time: "16:00:00", name: "After Clubs" },
        { time: "17:00:00", name: "After school" },
        { time: "23:31:59", name: "Midnight" }
];

const fridayScheduleB2 = [
{ time: "00:00:01", name: "Before School" },
        { time: "07:45:00", name: "Period 1" },
        { time: "08:23:00", name: "Passing" },
        { time: "08:28:00", name: "Period 2" },
        { time: "09:06:00", name: "Passing" },
        { time: "09:11:00", name: "Period 3" },
        { time: "09:49:00", name: "Passing" },
        { time: "09:54:00", name: "Period 4" },
        { time: "10:32:00", name: "Passing" },
        { time: "10:37:00", name: "Period 5" },
        { time: "11:15:00", name: "Passing" },
        { time: "11:20:00", name: "2nd Lunch" },
        { time: "11:45:00", name: "Passing" },
        { time: "11:50:00", name: "Period 7" },
        { time: "12:28:00", name: "Passing" },
        { time: "12:33:00", name: "Period 8" },
        { time: "13:11:00", name: "Dismissal" },
        { time: "13:30:00", name: "After School" },
        { time: "23:31:59", name: "Midnight" }
];

const saturdayScheduleB2 = [
{ time: "00:00:01", name: "Before School" },
        { time: "09:00:00", name: "1st Tutorial" },
        { time: "10:30:00", name: "Passing" },
        { time: "10:35:00", name: "2nd Tutorial" },
        { time: "12:00:00", name: "Dismissal" },
        { time: "12:30:00", name: "No School Event" }
];

const sundayScheduleB2 = [
{ time: "00:00:01", name: "Before School" },
        { time: "09:00:00", name: "No School Today" }
];


      // Building is selected from the URL:
      // index_merged.html        -> Building 2 (default)
      // index_merged.html?b=1    -> Building 1
      // index_merged.html?b=2    -> Building 2
      const params = new URLSearchParams(window.location.search);
      const building = params.get("b") === "1" ? 1 : 2;

      const buildingSchedules = {
        1: {
          regular: regularSchedule,
          friday: fridaySchedule,
          saturday: saturdaySchedule,
          sunday: sundaySchedule
        },
        2: {
          regular: regularScheduleB2,
          friday: fridayScheduleB2,
          saturday: saturdayScheduleB2,
          sunday: sundayScheduleB2
        }
      };

      function pickSchedule(now) {
        const day = now.getDay();
        const schedules = buildingSchedules[building];

        if (day === 5) return schedules.friday;
        if (day === 6) return schedules.saturday;
        if (day === 0) return schedules.sunday;
        return schedules.regular;
      }

      // === Sound beep ===
      let audioContext = null;
      let lastNextBellTime = null;

      function playBeep() {
        const checkbox = document.getElementById("soundBeep");
        if (!checkbox || !checkbox.checked) return;

        try {
          if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }

          if (audioContext.state === "suspended") {
            audioContext.resume();
          }

          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();

          oscillator.type = "sine";
          oscillator.frequency.value = 880;

          gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.25, audioContext.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.18);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.2);
        } catch (e) {
          console.log("Beep could not be played:", e);
        }
      }

      function updateBuildingSelector() {
        const selector = document.getElementById("url-navigator");
        selector.value = String(building);
        document.title = `Building ${building} Bell`;
      }

      function navigateToBuilding(dropdown) {
        const target = dropdown.value;
        if (target === "1" || target === "2") {
          const url = new URL(window.location.href);
          url.search = "";
          if (target === "1") url.searchParams.set("b", "1");
          else url.searchParams.set("b", "2");
          window.location.href = url.toString();
        }
      }

      function renderSchedule(schedule, currentTime) {
        const tbody = document.querySelector("#dailySchedule tbody");
        tbody.innerHTML = "";

        // Find current + next items (by time strings, because they are HH:MM:SS)
        const nextBell = schedule.find(item => item.time > currentTime);
        const currentBell = schedule.findLast(item => item.time < currentTime);

        schedule.forEach(item => {
          const row = document.createElement("tr");

          if (currentBell && item.time === currentBell.time) row.classList.add("currentRow");
          if (nextBell && item.time === nextBell.time) row.classList.add("nextRow");

          row.innerHTML = `
            <td>${item.time.substring(0, 5)}</td>
            <td>${item.name}</td>
          `;
          tbody.appendChild(row);
        });
      }

      function updateDisplay() {
        const now = new Date();
        const currentTime = now.toTimeString().split(" ")[0];
        const currentDate = now.toLocaleDateString("en-US", { month: "short", day: "numeric" });

        document.getElementById("date").innerText = `📅${currentDate}`;
        document.getElementById("time").innerText = ` ⌚${currentTime}`;

        const schedule = pickSchedule(now);

        // Update schedule table every second (highlights current + next)
        renderSchedule(schedule, currentTime);

        // Find next/current bell for timer display
        const nextBell = schedule.find(item => item.time > currentTime);
        const currentBell = schedule.findLast(item => item.time < currentTime) || schedule[0];

        // Beep once when the displayed next bell changes.
        if (nextBell && nextBell.time !== lastNextBellTime) {
          if (lastNextBellTime !== null) {
            playBeep();
          }
          lastNextBellTime = nextBell.time;
        }

        if (nextBell) {
          const nextBellTime = new Date(`${now.toDateString()} ${nextBell.time}`);
          const countdown = Math.floor((nextBellTime - now) / 1000);

          let countdownMinutes = Math.floor(countdown / 60);
          let countdownSeconds = countdown % 60;


          if (countdownSeconds < 10) countdownSeconds = "0" + countdownSeconds;
          if (countdownMinutes < 10) countdownMinutes = "0" + countdownMinutes;

          document.getElementById("countdown").innerText = `⏳${countdownMinutes}: ${countdownSeconds}`;
          document.getElementById("currentPeriod").innerText = currentBell.name;
          document.getElementById("nextBellTime").innerText = `🔔 ${nextBell.time.substring(0, 5)}`;
        } else {
          document.getElementById("countdown").innerText = " ";
          document.getElementById("currentPeriod").innerHTML = "School day has ended.";
          document.getElementById("nextBellTime").innerText = " ";
        }
      }

      updateBuildingSelector();

      document.getElementById("soundBeep").addEventListener("change", function () {
        if (this.checked) {
          try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
            playBeep();
          } catch (e) {
            console.log("Audio is not supported by this browser.");
          }
        }
      });

      // Run immediately and then every second
      updateDisplay();
      setInterval(updateDisplay, 1000);

      // Fullscreen toggle
      var elem = document.documentElement;
      var f = 0;
      function openFullscreen() {
        if (f === 0) {
          var ff = 1;
          if (elem.requestFullscreen) elem.requestFullscreen();
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
          f = ff;
        } else {
          document.exitFullscreen();
          f = 0;
        }
      }
    </script>

</body>
