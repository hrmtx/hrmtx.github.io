<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days to Graduation</title>
<style>


    body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0057B8;
        font-family: Arial, Helvetica, sans-serif;
    }

    .number {
        font-size: clamp(18vw, 4vw, 12px);
        font-weight: 900;
		line-spacing: 0px;
		line-height: .75;
    }

    .label {
        margin-top: 0px;
        font-size: clamp(6vw, 2vw, 6px);
        font-weight: 800;
       line-spacing: 4px;

    }
</style>
</head>
<body>
<table width=100% >
	<tr>
		<td>
			<div id="days" class="number"></div>
		</td>
		<td width=10px >
		</td>
 		<td>
    			<div class="label">DAYS TO<br>GRADUATION</div>
 		</td>
	</tr>
</table>
<script>
function updateCountdown() {
    const today = new Date();

    // Graduation: May 29, 2027
    const graduation = Date.UTC(2027, 4, 29);

    const todayUTC = Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    const days = Math.max(
        0,
        Math.ceil((graduation - todayUTC) / 86400000)
    );

    document.getElementById("days").textContent = days;
}

updateCountdown();
setInterval(updateCountdown, 60000);
</script>

</body>
</html>
